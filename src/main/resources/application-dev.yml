spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kyc_database?escapeSyntaxCallMode=callIfNoReturn
    username: kyc_user
    password: kyc_pass
    hikari:
      maximum-pool-size: 1

  graphql:
    schema:
      printer:
        enabled: true

eureka:
  client:
    enabled: true
    fetchRegistry: true
    serviceUrl:
      defaultZone: http://localhost:9100/eureka

logging:
  level:
    root: INFO
    com.kyc: INFO
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping: TRACE